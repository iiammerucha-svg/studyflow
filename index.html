function treeSvg(g,sz){const T=TH(),tr=T.tr;let body;
 if(!g.done)body=`<path d="M150 285 C150 268 150 256 150 244" stroke="#6BAA75" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="138" cy="250" rx="12" ry="6" fill="#8CCB8F" transform="rotate(-30 138 250)"/><ellipse cx="162" cy="244" rx="12" ry="6" fill="#8CCB8F" transform="rotate(30 162 244)"/>`;
 else{const s=.5+g.lv*.1;let bl='';for(let i=0;i<g.bl;i++){const t=TIPS[i%10],a=fr(i+1)*6.283,d=6+fr(i+50)*36,x=(t[0]+Math.cos(a)*d).toFixed(1),y=(t[1]+Math.sin(a)*d*.8).toFixed(1),r=5+(i%3)*1.6,c=tr.c[i%4];
  bl+=T.shape=='star'?`<path transform="translate(${x} ${y}) scale(${(r/11*1.25).toFixed(2)})" d="M0 -11Q0 0 11 0Q0 0 0 11Q0 0 -11 0Q0 0 0 -11Z" fill="${c}"/>`:T.shape=='bubble'?`<circle cx="${x}" cy="${y}" r="${r.toFixed(1)}" fill="${c}" fill-opacity=".5" stroke="${c}" stroke-width="1.2"/>`:`<circle cx="${x}" cy="${y}" r="${r.toFixed(1)}" fill="${c}" opacity=".92"/>`}
  body=`<g transform="translate(150 285) scale(${s}) translate(-150 -285)"><g class="tree"><path d="M150 285 C146 245 154 205 150 160" stroke="${tr.t}" stroke-width="16" fill="none" stroke-linecap="round"/>${BR.map(b=>`<path d="M${b[0]} ${b[1]}L${b[2]} ${b[3]}" stroke="${tr.b}" stroke-width="${b[4]}" stroke-linecap="round"/>`).join('')}${bl}</g></g>`}
 let fp='';for(let i=0;i<Math.min(g.ov,14);i++)fp+=`<g transform="translate(${30+Math.round(fr(i+9)*230)} ${284+Math.round(fr(i+3)*12)}) rotate(${Math.round(fr(i+5)*360)}) scale(.55)">${PSHAPE('#E58EAC',i)}</g>`;
 return`<svg viewBox="0 0 300 300" width="${sz}" height="${sz}" style="display:block;margin:0 auto;max-width:100%"><ellipse cx="150" cy="290" rx="135" ry="13" fill="#F6C6D6" opacity=".7"/>${body}${fp}</svg>`}
